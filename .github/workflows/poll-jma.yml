name: Poll JMA Feed

on:
  schedule:
    - cron: '*/5 * * * *'  # 5分ごと
  workflow_dispatch:        # 手動実行

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Poll JMA Feed
        run: node scripts/github-poll.js

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add api/latest.json
          if [ -f api/sent-notifs.json ]; then
            git add api/sent-notifs.json
          fi
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: update JMA alert data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push || true
